version: 2

updates:
  # Python dependencies. Dependabot understands uv.lock via the pip ecosystem.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One PR for the routine patch noise; majors still arrive individually
      # so a breaking change is never buried in a batch of ten bumps.
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Pinning actions to SHAs means no automatic upstream fixes — Dependabot is
  # what keeps those pins current, including security patches.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        update-types: ["minor", "patch"]
